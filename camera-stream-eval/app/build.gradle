plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.mocapstudio.tabletstream'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.mocapstudio.tabletstream'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    // Fixed debug key shipped with the project: any PC that builds this can update an installed copy.
    // Test tool only - not a release key.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
