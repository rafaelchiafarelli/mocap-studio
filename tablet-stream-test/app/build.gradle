plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.mocapstudio.tabletstream'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.mocapstudio.tabletstream'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
